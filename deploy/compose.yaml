# docker compose -f deploy/compose.yaml up -d
#
# Caddy terminates TLS and proxies both the page and the WebSocket upgrade to
# the demo on one upstream port. Set DOMAIN to the name pointing at this box;
# leave it unset and Caddy serves plain HTTP on :80 for a smoke test.
services:
  sarathi:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      SARATHI_SCENARIO: ${SARATHI_SCENARIO:-village_road_unmarked}
    expose:
      - "8420"
    # One core is the whole budget for a world, and the box has others to run
    # the proxy with. The cap makes a runaway visible instead of contagious.
    cpus: 1.5
    mem_limit: 1g

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - sarathi

volumes:
  caddy_data:
  caddy_config:
