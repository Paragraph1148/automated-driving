[project]
name = "sarathi"
version = "0.4.0"
description = "Adaptive path planning and collision avoidance for autonomous vehicles on unstructured Indian roads (SIH26037)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "playwright>=1.44",
    "pillow>=10.0",
    "python-pptx>=1.0",
]

[project.scripts]
sarathi = "sarathi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sarathi"]

# The viewer template and the scenario library ship inside the package, so
# `uvx --from git+... sarathi serve` works with no checkout on disk.
[tool.hatch.build.targets.wheel.force-include]
"scenarios" = "sarathi/_scenarios"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
